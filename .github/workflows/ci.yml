name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP quality (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS
        run: composer phpcs

      - name: PHPStan
        run: composer phpstan

      - name: PHPUnit
        run: composer phpunit

  asset-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: JS lint
        run: npm run lint:js

      - name: CSS lint
        run: npm run lint:css

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Activate plugin
        run: npx wp-env run cli wp plugin activate remove-schema

      - name: Confirm plugin is active
        run: npx wp-env run cli wp plugin is-active remove-schema

      - name: Confirm activation option exists
        run: npx wp-env run cli wp option get remove_schema_version

      - name: Legacy options smoke test
        run: |
          npx wp-env run cli wp eval '
          $options = get_option( "remove-schema" );
          if ( ! is_array( $options ) ) {
            \WP_CLI::error( "Missing legacy remove-schema option." );
          }
          if ( false !== get_option( "remove_schema_options", false ) ) {
            \WP_CLI::error( "Unexpected remove_schema_options option exists." );
          }
          \WP_CLI::success( "Legacy remove-schema option is available." );
          '

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build release archive
        run: npm run package:release

      - name: Extract release archive
        run: unzip -q dist/remove-schema.zip -d plugin-check-build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: plugin-check-build/remove-schema
          include-experimental: 'true'
